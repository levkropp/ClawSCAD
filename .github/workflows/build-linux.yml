name: Build Linux (AppImage)

# Verification only. This workflow does NOT publish releases — see the note in
# build-windows.yml and docs/releasing.md. `scripts/release.ps1` owns the
# update feed.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache OpenSCAD vendor binary
        uses: actions/cache@v4
        with:
          path: vendors/
          key: openscad-linux-2026.03.16

      - name: Download OpenSCAD
        run: npm run download-openscad

      - name: Build renderer
        run: npm run build:renderer

      - name: Build AppImage
        run: npx electron-builder --linux --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: ClawSCAD-Linux-AppImage
          path: release/*.AppImage
          if-no-files-found: warn
